<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamly | Watch Movies & TV Shows</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #1a1a1a;
            --accent: #e50914;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 100;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(11,11,11,1)), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 50px;
        }
        .hero-content { max-width: 600px; }
        .hero-title { font-size: 64px; margin: 0; }
        .hero-tagline { font-size: 20px; color: var(--text-dim); margin: 20px 0; }
        .btn {
            padding: 12px 30px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .section { padding: 40px 50px; }
        .section-title { font-size: 24px; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .movie-card:hover { transform: scale(1.05); }
        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background-color: #333;
            object-fit: cover;
        }
        .movie-info { padding: 15px; }
        .movie-name { font-weight: 700; margin: 0; }
        .movie-meta { font-size: 14px; color: var(--text-dim); margin-top: 5px; }
    </style>
</head>
<body>
    <nav><div class="logo">Streamly</div></nav>
    <div class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Interstellar</h1>
            <p class="hero-tagline">A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival.</p>
            <a href="#" class="btn">Watch Now</a>
        </div>
    </div>
    <div class="section">
        <h2 class="section-title">Trending Now</h2>
        <div class="grid">
            <div class="movie-card"><img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=400&q=80" class="movie-poster"><div class="movie-info"><p class="movie-name">The Dark Knight</p><p class="movie-meta">2008 • Action</p></div></div>
            <div class="movie-card"><img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=400&q=80" class="movie-poster"><div class="movie-info"><p class="movie-name">Inception</p><p class="movie-meta">2010 • Sci-Fi</p></div></div>
            <div class="movie-card"><img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" class="movie-poster"><div class="movie-info"><p class="movie-name">Gladiator</p><p class="movie-meta">2000 • Drama</p></div></div>
            <div class="movie-card"><img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?auto=format&fit=crop&w=400&q=80" class="movie-poster"><div class="movie-info"><p class="movie-name">Dune</p><p class="movie-meta">2021 • Sci-Fi</p></div></div>
        </div>
    </div>
</body>
</html>
